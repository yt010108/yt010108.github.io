# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

# Public editor at /admin/. Only holders of a GitHub token with
# repository write access can save changes.
backend:
  name: github
  repo: yt010108/yt010108.github.io
  branch: main
  auth_methods: [token]

# Hugo copies static/ to the site root on build.
media_folder: /static/images
public_folder: /images

collections:
  - name: posts
    label: Posts
    label_singular: Post
    folder: /content/posts
    create: true
    extension: md
    format: toml-frontmatter
    fields:
      - { name: title, label: 제목, widget: string }
      - { name: description, label: 설명, widget: text, required: false }
      - { name: summary, label: 목록 요약, widget: text, required: false }
      - { name: date, label: 작성일, widget: datetime, type: date }
      - { name: tags, label: 태그, widget: list, required: false }
      - { name: showToc, label: 목차 표시, widget: boolean, default: true, required: false }
      - { name: draft, label: 초안, widget: boolean, default: false, required: false }
      # Preserve the existing [extra] table used by the site's sample posts.
      - name: extra
        label: 추가 설정
        widget: object
        required: false
        fields:
          - { name: sample, label: 예시 글, widget: boolean, required: false }
      - { name: body, label: 본문, widget: richtext }
