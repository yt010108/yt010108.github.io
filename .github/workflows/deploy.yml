name: Deploy static security blog

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # UTC slots for 08:50, 11:50 and 14:50 in Seoul, every day.
    - cron: '50 2,5,23 * * *'

permissions:
  contents: read

concurrency:
  # Each publishing run reads the archive produced by the preceding deployment.
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Refresh news from the previous Pages archive
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          archive="$RUNNER_TEMP/published-news.json"
          status=$(curl --silent --show-error --location --retry 2 --connect-timeout 8 --max-time 30 \
            --output "$archive" --write-out '%{http_code}' \
            "https://yt010108.github.io/assets/security-news.json?run=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT")
          case "$status" in
            200) ;;
            404) archive=assets/security-news.json ;;
            *) echo "::error::Could not restore the published news archive (HTTP $status)"; exit 1 ;;
          esac
          python3 scripts/collect-news.py --published-archive "$archive"
      - name: Build editor and published content
        run: |
          npm ci --ignore-scripts
          npm run build
          npm test
          python3 -B tests/test_news_archive.py
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check content.js
          node --check theme.js
          node --check admin/assets/editor.js
          node --check assets/posts.js
          node --check assets/notes-board.js
          node --check assets/dashboard.js
          node --check assets/site-data.js
          node --check published.js
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
