name: Build and deploy Hugo

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install Hugo 0.168.0 extended
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/hugo-bin"
          curl --fail --location --retry 3 \
            https://github.com/gohugoio/hugo/releases/download/v0.168.0/hugo_extended_0.168.0_linux-amd64.tar.gz \
            --output "$RUNNER_TEMP/hugo.tar.gz"
          echo "787f100057328824f38c6ad7c87ff10d6451ae0a7bc39cedaad0dd2bcde17e53  $RUNNER_TEMP/hugo.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/hugo.tar.gz" -C "$RUNNER_TEMP/hugo-bin" hugo
          echo "$RUNNER_TEMP/hugo-bin" >> "$GITHUB_PATH"
      - name: Build PaperMod site
        run: hugo --minify --baseURL https://yt010108.github.io/
      - name: Check rendered pages and assets
        run: python3 scripts/check-output.py
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
