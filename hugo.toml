baseURL = "https://yt010108.github.io/"
title = "yt010108"
locale = "ko-KR"
defaultContentLanguage = "ko"
theme = "PaperMod"
hasCJKLanguage = true
enableRobotsTXT = true
buildDrafts = false
buildFuture = false
summaryLength = 60

[pagination]
pagerSize = 3

[taxonomies]
tag = "tags"

[outputs]
home = ["HTML", "RSS", "JSON"]

[outputFormats.RSS]
baseName = "rss"

[params]
env = "production"
description = "보안과 네트워크를 공부하며 남긴 기록."
author = "yt010108"
mainSections = ["posts", "notes"]
defaultTheme = "auto"
disableThemeToggle = false
ShowReadingTime = true
ShowCodeCopyButtons = true
ShowPostNavLinks = true
ShowBreadCrumbs = true
ShowShareButtons = true
ShowWordCount = false
ShowRssButtonInSectionTermList = true
ShowPageNums = true
ShowToc = true
TocOpen = false
comments = false

[params.sidebar]
avatarText = "y"
description = "보안과 네트워크를 공부하는 기록"

[params.homeInfoParams]
Title = "yt010108"
Content = """
보안과 네트워크를 공부하며 남긴 기록.

지금 수정중입니다
"""

[[params.socialIcons]]
name = "github"
title = "GitHub"
url = "https://github.com/yt010108"

[[params.socialIcons]]
name = "rss"
title = "RSS"
url = "/rss.xml"

[params.assets]
favicon = "/favicon.svg"
favicon16x16 = "/favicon.svg"
favicon32x32 = "/favicon.svg"
apple_touch_icon = "/favicon.svg"
safari_pinned_tab = "/favicon.svg"

[params.fuseOpts]
isCaseSensitive = false
shouldSort = true
threshold = 0.3
ignoreLocation = true
minMatchCharLength = 1
keys = ["title", "summary", "content"]

[[menu.main]]
identifier = "about"
name = "About"
url = "/about/"
weight = 10

[[menu.main]]
identifier = "archives"
name = "Archive"
url = "/archives/"
weight = 20

[[menu.main]]
identifier = "search"
name = "Search"
url = "/search/"
weight = 30

[[menu.main]]
identifier = "tags"
name = "Tags"
url = "/tags/"
weight = 40

[markup.goldmark.renderer]
unsafe = true

[markup.highlight]
noClasses = false

[markup.tableOfContents]
startLevel = 2
endLevel = 6
