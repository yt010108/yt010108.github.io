<header class="blog-toolbar">
    <button class="blog-icon-button blog-menu-toggle" id="blog-menu-toggle" type="button" aria-label="블로그 메뉴 열기" aria-controls="blog-sidebar" aria-expanded="false">{{ partial "blog/icon.html" "menu" }}</button>
    <nav class="blog-breadcrumbs" aria-label="현재 위치">
        <a href="{{ "" | absLangURL }}">Home</a><span aria-hidden="true">/</span>
        {{- if .IsPage }}
        <a href="{{ "archives/" | relLangURL }}">Archive</a><span aria-hidden="true">/</span><span>{{ if eq .Section "notes" }}Network{{ else }}Blog{{ end }}</span>
        {{- else }}<span>{{ .Title }}</span>{{ end }}
    </nav>
    {{- if not site.Params.disableThemeToggle }}
    <button class="blog-icon-button theme-toggle" id="theme-toggle" type="button" accesskey="t" aria-label="Toggle theme" title="테마 전환 (Alt + T)">
        <svg class="moon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>
        <svg class="sun" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="5"/><path d="M12 1v2m0 18v2M1 12h2m18 0h2M4.2 4.2l1.4 1.4m12.8 12.8 1.4 1.4M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
    </button>
    {{- end }}
</header>
