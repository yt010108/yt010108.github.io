<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 400" font-family="'Pretendard','Noto Sans KR','Helvetica Neue',sans-serif">
  <defs>
    <marker id="a" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0 0,7 2.5,0 5" fill="#999"/>
    </marker>
  </defs>

  <rect width="740" height="400" fill="#fff"/>
  <text x="370" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#111">Docker Compose Architecture</text>
  <line x1="240" y1="40" x2="500" y2="40" stroke="#ddd" stroke-width="1"/>

  <!-- Docker boundary -->
  <rect x="18" y="48" width="704" height="330" rx="6" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="40" y="67" font-size="10" font-weight="600" fill="#888">docker-compose.yml</text>

  <!-- Browser -->
  <rect x="35" y="90" width="85" height="55" rx="5" fill="#fafafa" stroke="#ddd" stroke-width="1"/>
  <text x="77" y="115" text-anchor="middle" font-size="10" font-weight="600" fill="#333">Browser</text>
  <text x="77" y="132" text-anchor="middle" font-size="9" fill="#999">:80</text>

  <path d="M122,117 L160,117" stroke="#999" stroke-width="1.2" fill="none" marker-end="url(#a)"/>

  <!-- Frontend Container -->
  <rect x="165" y="80" width="220" height="210" rx="5" fill="#fafafa" stroke="#555" stroke-width="1.5"/>
  <rect x="165" y="80" width="220" height="25" rx="5" fill="#555"/>
  <rect x="165" y="98" width="220" height="7" fill="#555"/>
  <text x="275" y="98" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">locallens-frontend</text>

  <rect x="180" y="118" width="190" height="30" rx="4" fill="#fff" stroke="#ccc" stroke-width="1"/>
  <text x="275" y="138" text-anchor="middle" font-size="10" font-weight="600" fill="#333">Nginx Alpine</text>

  <rect x="180" y="158" width="190" height="26" rx="4" fill="#fff" stroke="#ccc" stroke-width="1"/>
  <text x="275" y="175" text-anchor="middle" font-size="9" fill="#666">React 빌드 결과 (dist/)</text>

  <rect x="180" y="194" width="190" height="26" rx="4" fill="#fff" stroke="#ccc" stroke-width="1"/>
  <text x="275" y="211" text-anchor="middle" font-size="9" fill="#666">리버스 프록시 /api/ →</text>

  <rect x="180" y="230" width="190" height="26" rx="4" fill="#fff" stroke="#ccc" stroke-width="1"/>
  <text x="275" y="247" text-anchor="middle" font-size="9" fill="#666">보안 헤더 (XSS, CSRF, Frame)</text>

  <text x="275" y="278" text-anchor="middle" font-size="9" fill="#bbb">멀티스테이지 빌드 · ~40MB</text>

  <!-- Arrow to API -->
  <path d="M387,207 L420,207" stroke="#999" stroke-width="1.2" fill="none" marker-end="url(#a)"/>
  <text x="403" y="200" font-size="8" fill="#aaa">/api/</text>

  <!-- API Container -->
  <rect x="425" y="80" width="260" height="210" rx="5" fill="#fafafa" stroke="#555" stroke-width="1.5"/>
  <rect x="425" y="80" width="260" height="25" rx="5" fill="#555"/>
  <rect x="425" y="98" width="260" height="7" fill="#555"/>
  <text x="555" y="98" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">locallens-api</text>

  <rect x="440" y="118" width="230" height="30" rx="4" fill="#fff" stroke="#ccc" stroke-width="1"/>
  <text x="555" y="138" text-anchor="middle" font-size="10" font-weight="600" fill="#333">FastAPI + Uvicorn</text>

  <rect x="440" y="158" width="110" height="26" rx="4" fill="#fff" stroke="#ccc" stroke-width="1"/>
  <text x="495" y="175" text-anchor="middle" font-size="9" fill="#666">SQLite</text>

  <rect x="560" y="158" width="110" height="26" rx="4" fill="#fff" stroke="#ccc" stroke-width="1"/>
  <text x="615" y="175" text-anchor="middle" font-size="9" fill="#666">ChromaDB</text>

  <rect x="440" y="194" width="110" height="26" rx="4" fill="#fff" stroke="#ccc" stroke-width="1"/>
  <text x="495" y="211" text-anchor="middle" font-size="9" fill="#666">Arctic Embed</text>

  <rect x="560" y="194" width="110" height="26" rx="4" fill="#fff" stroke="#ccc" stroke-width="1"/>
  <text x="615" y="211" text-anchor="middle" font-size="9" fill="#666">appuser (non-root)</text>

  <rect x="440" y="230" width="230" height="26" rx="4" fill="#fff" stroke="#ccc" stroke-width="1"/>
  <text x="555" y="247" text-anchor="middle" font-size="9" fill="#666">Healthcheck (30s interval)</text>

  <text x="555" y="278" text-anchor="middle" font-size="9" fill="#bbb">Python 3.10-slim · :8000</text>

  <!-- Network bar -->
  <rect x="35" y="310" width="660" height="40" rx="4" fill="#f5f5f5" stroke="#ccc" stroke-width="1"/>
  <text x="365" y="335" text-anchor="middle" font-size="10" font-weight="600" fill="#555">locallens-net  (Bridge Network)</text>

  <!-- Network lines -->
  <line x1="275" y1="290" x2="275" y2="308" stroke="#ccc" stroke-width="1"/>
  <line x1="555" y1="290" x2="555" y2="308" stroke="#ccc" stroke-width="1"/>

  <!-- Volume labels -->
  <text x="495" y="365" text-anchor="middle" font-size="9" fill="#aaa">📦 api-data (volume)</text>
  <text x="630" y="365" text-anchor="middle" font-size="9" fill="#aaa">📦 model-cache (volume)</text>
  <line x1="495" y1="290" x2="495" y2="355" stroke="#ddd" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="630" y1="290" x2="630" y2="355" stroke="#ddd" stroke-width="1" stroke-dasharray="3,2"/>
</svg>