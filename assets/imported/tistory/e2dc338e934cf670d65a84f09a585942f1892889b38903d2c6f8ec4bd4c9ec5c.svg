<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="'Pretendard','Noto Sans KR','Helvetica Neue',sans-serif">
  <defs>
    <marker id="a" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0 0,7 2.5,0 5" fill="#bbb"/>
    </marker>
  </defs>

  <rect width="900" height="380" fill="#fff"/>
  <text x="450" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#111">9-Stage Batch Pipeline</text>
  <line x1="330" y1="42" x2="570" y2="42" stroke="#ddd" stroke-width="1"/>

  <!-- Row 1: Stage 1-5 -->
  <!-- Stage 1 -->
  <rect x="15" y="65" width="152" height="120" rx="5" fill="#fafafa" stroke="#ddd" stroke-width="1"/>
  <rect x="15" y="65" width="152" height="28" rx="5" fill="#333"/>
  <rect x="15" y="83" width="152" height="10" fill="#333"/>
  <text x="91" y="85" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">1. 장소 수집</text>
  <text x="91" y="115" text-anchor="middle" font-size="10" fill="#555">VisitJeju API</text>
  <text x="91" y="132" text-anchor="middle" font-size="9" fill="#999">58페이지 관광지 데이터</text>
  <text x="91" y="147" text-anchor="middle" font-size="9" fill="#999">0.5초 간격 요청</text>
  <text x="91" y="173" text-anchor="middle" font-size="9" font-weight="600" fill="#666">→ JSON</text>

  <path d="M169,125 L185,125" stroke="#bbb" stroke-width="1.2" fill="none" marker-end="url(#a)"/>

  <!-- Stage 2 -->
  <rect x="190" y="65" width="152" height="120" rx="5" fill="#fafafa" stroke="#ddd" stroke-width="1"/>
  <rect x="190" y="65" width="152" height="28" rx="5" fill="#333"/>
  <rect x="190" y="83" width="152" height="10" fill="#333"/>
  <text x="266" y="85" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">2. 리뷰 크롤링</text>
  <text x="266" y="115" text-anchor="middle" font-size="10" fill="#555">Google Maps + Selenium</text>
  <text x="266" y="132" text-anchor="middle" font-size="9" fill="#999">장소당 최대 30개 리뷰</text>
  <text x="266" y="147" text-anchor="middle" font-size="9" fill="#999">랜덤 딜레이 2~6초</text>
  <text x="266" y="173" text-anchor="middle" font-size="9" font-weight="600" fill="#666">→ 리뷰 텍스트</text>

  <path d="M344,125 L360,125" stroke="#bbb" stroke-width="1.2" fill="none" marker-end="url(#a)"/>

  <!-- Stage 3 -->
  <rect x="365" y="65" width="152" height="120" rx="5" fill="#fafafa" stroke="#ddd" stroke-width="1"/>
  <rect x="365" y="65" width="152" height="28" rx="5" fill="#555"/>
  <rect x="365" y="83" width="152" height="10" fill="#555"/>
  <text x="441" y="85" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">3. DB 저장</text>
  <text x="441" y="115" text-anchor="middle" font-size="10" fill="#555">SQLite</text>
  <text x="441" y="132" text-anchor="middle" font-size="9" fill="#999">7개 테이블 · Upsert</text>
  <text x="441" y="173" text-anchor="middle" font-size="9" font-weight="600" fill="#666">→ 구조화 데이터</text>

  <path d="M519,125 L535,125" stroke="#bbb" stroke-width="1.2" fill="none" marker-end="url(#a)"/>

  <!-- Stage 4 -->
  <rect x="540" y="65" width="152" height="120" rx="5" fill="#fafafa" stroke="#ddd" stroke-width="1"/>
  <rect x="540" y="65" width="152" height="28" rx="5" fill="#555"/>
  <rect x="540" y="83" width="152" height="10" fill="#555"/>
  <text x="616" y="85" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">4. 키워드 추출</text>
  <text x="616" y="115" text-anchor="middle" font-size="10" fill="#555">KoNLPy + TF-IDF</text>
  <text x="616" y="132" text-anchor="middle" font-size="9" fill="#999">불용어 필터링 · Top 3</text>
  <text x="616" y="173" text-anchor="middle" font-size="9" font-weight="600" fill="#666">→ 키워드 목록</text>

  <path d="M694,125 L710,125" stroke="#bbb" stroke-width="1.2" fill="none" marker-end="url(#a)"/>

  <!-- Stage 5 -->
  <rect x="715" y="65" width="152" height="120" rx="5" fill="#fafafa" stroke="#ddd" stroke-width="1"/>
  <rect x="715" y="65" width="152" height="28" rx="5" fill="#777"/>
  <rect x="715" y="83" width="152" height="10" fill="#777"/>
  <text x="791" y="85" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">5. 감성 분석</text>
  <text x="791" y="115" text-anchor="middle" font-size="10" fill="#555">KOTE 모델</text>
  <text x="791" y="132" text-anchor="middle" font-size="9" fill="#999">44가지 감정 · Top 3</text>
  <text x="791" y="173" text-anchor="middle" font-size="9" font-weight="600" fill="#666">→ 감정 레이블</text>

  <!-- Arrow down -->
  <path d="M791,187 L791,207" stroke="#bbb" stroke-width="1.2" fill="none" marker-end="url(#a)"/>

  <!-- Row 2: Stage 6-9 (reverse) -->
  <!-- Stage 6 -->
  <rect x="715" y="210" width="152" height="120" rx="5" fill="#fafafa" stroke="#ddd" stroke-width="1"/>
  <rect x="715" y="210" width="152" height="28" rx="5" fill="#777"/>
  <rect x="715" y="228" width="152" height="10" fill="#777"/>
  <text x="791" y="230" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">6. 감성 점수</text>
  <text x="791" y="260" text-anchor="middle" font-size="10" fill="#555">긍정 비율 계산</text>
  <text x="791" y="277" text-anchor="middle" font-size="9" fill="#999">0~1 스케일</text>
  <text x="791" y="318" text-anchor="middle" font-size="9" font-weight="600" fill="#666">→ 감성 점수</text>

  <path d="M713,270 L697,270" stroke="#bbb" stroke-width="1.2" fill="none" marker-end="url(#a)"/>

  <!-- Stage 7 -->
  <rect x="540" y="210" width="152" height="120" rx="5" fill="#fafafa" stroke="#ddd" stroke-width="1"/>
  <rect x="540" y="210" width="152" height="28" rx="5" fill="#999"/>
  <rect x="540" y="228" width="152" height="10" fill="#999"/>
  <text x="616" y="230" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">7. 대표 감정 추출</text>
  <text x="616" y="260" text-anchor="middle" font-size="10" fill="#555">빈도 기반 집계</text>
  <text x="616" y="277" text-anchor="middle" font-size="9" fill="#999">장소별 감정 Top 3</text>
  <text x="616" y="318" text-anchor="middle" font-size="9" font-weight="600" fill="#666">→ 대표 감정</text>

  <path d="M538,270 L522,270" stroke="#bbb" stroke-width="1.2" fill="none" marker-end="url(#a)"/>

  <!-- Stage 8 -->
  <rect x="365" y="210" width="152" height="120" rx="5" fill="#fafafa" stroke="#ddd" stroke-width="1"/>
  <rect x="365" y="210" width="152" height="28" rx="5" fill="#999"/>
  <rect x="365" y="228" width="152" height="10" fill="#999"/>
  <text x="441" y="230" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">8. 맥락 문장 생성</text>
  <text x="441" y="260" text-anchor="middle" font-size="10" fill="#555">Ollama + Gemma3</text>
  <text x="441" y="277" text-anchor="middle" font-size="9" fill="#999">100자 이내 요약</text>
  <text x="441" y="318" text-anchor="middle" font-size="9" font-weight="600" fill="#666">→ 맥락 문장</text>

  <path d="M363,270 L347,270" stroke="#bbb" stroke-width="1.2" fill="none" marker-end="url(#a)"/>

  <!-- Stage 9 -->
  <rect x="190" y="210" width="152" height="120" rx="5" fill="#fafafa" stroke="#ddd" stroke-width="1"/>
  <rect x="190" y="210" width="152" height="28" rx="5" fill="#333"/>
  <rect x="190" y="228" width="152" height="10" fill="#333"/>
  <text x="266" y="230" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">9. 벡터 저장</text>
  <text x="266" y="260" text-anchor="middle" font-size="10" fill="#555">Arctic Embed Korean</text>
  <text x="266" y="277" text-anchor="middle" font-size="9" fill="#999">ChromaDB 저장</text>
  <text x="266" y="318" text-anchor="middle" font-size="9" font-weight="600" fill="#666">→ 검색 준비 완료</text>

  <!-- Final -->
  <path d="M188,270 L115,270" stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <rect x="35" y="245" width="75" height="50" rx="5" fill="#333"/>
  <text x="72" y="268" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">서빙</text>
  <text x="72" y="283" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">준비 ✓</text>

  <!-- Legend -->
  <rect x="30" y="355" width="10" height="10" rx="2" fill="#333"/>
  <text x="46" y="365" font-size="9" fill="#888">수집/저장</text>
  <rect x="100" y="355" width="10" height="10" rx="2" fill="#555"/>
  <text x="116" y="365" font-size="9" fill="#888">추출</text>
  <rect x="150" y="355" width="10" height="10" rx="2" fill="#777"/>
  <text x="166" y="365" font-size="9" fill="#888">감성분석</text>
  <rect x="220" y="355" width="10" height="10" rx="2" fill="#999"/>
  <text x="236" y="365" font-size="9" fill="#888">생성</text>
</svg>