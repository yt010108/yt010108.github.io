<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" font-family="'Pretendard','Noto Sans KR','Helvetica Neue',sans-serif">
  <defs>
    <marker id="a" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0 0,7 2.5,0 5" fill="#999"/>
    </marker>
  </defs>

  <rect width="800" height="280" fill="#fff"/>
  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#111">Search Flow</text>
  <line x1="320" y1="40" x2="480" y2="40" stroke="#ddd" stroke-width="1"/>

  <!-- Step 1 -->
  <rect x="20" y="60" width="125" height="72" rx="5" fill="#fafafa" stroke="#ddd" stroke-width="1"/>
  <text x="82" y="82" text-anchor="middle" font-size="10" font-weight="700" fill="#333">① 사용자 입력</text>
  <text x="82" y="100" text-anchor="middle" font-size="9" fill="#999">"조용한 해변에서</text>
  <text x="82" y="114" text-anchor="middle" font-size="9" fill="#999">힐링하고 싶어"</text>

  <path d="M147,96 L168,96" stroke="#bbb" stroke-width="1.2" fill="none" marker-end="url(#a)"/>

  <!-- Step 2 -->
  <rect x="173" y="60" width="125" height="72" rx="5" fill="#fafafa" stroke="#ddd" stroke-width="1"/>
  <text x="235" y="82" text-anchor="middle" font-size="10" font-weight="700" fill="#333">② 벡터 임베딩</text>
  <text x="235" y="100" text-anchor="middle" font-size="9" fill="#999">Arctic Embed Korean</text>
  <text x="235" y="114" text-anchor="middle" font-size="9" fill="#999">텍스트 → 벡터</text>

  <path d="M300,96 L321,96" stroke="#bbb" stroke-width="1.2" fill="none" marker-end="url(#a)"/>

  <!-- Step 3 -->
  <rect x="326" y="60" width="125" height="72" rx="5" fill="#fafafa" stroke="#ddd" stroke-width="1"/>
  <text x="388" y="82" text-anchor="middle" font-size="10" font-weight="700" fill="#333">③ 벡터 검색</text>
  <text x="388" y="100" text-anchor="middle" font-size="9" fill="#999">ChromaDB</text>
  <text x="388" y="114" text-anchor="middle" font-size="9" fill="#999">코사인 유사도 KNN</text>

  <path d="M453,96 L474,96" stroke="#bbb" stroke-width="1.2" fill="none" marker-end="url(#a)"/>

  <!-- Step 4 -->
  <rect x="479" y="60" width="125" height="72" rx="5" fill="#fafafa" stroke="#ddd" stroke-width="1"/>
  <text x="541" y="82" text-anchor="middle" font-size="10" font-weight="700" fill="#333">④ 상세 정보 조합</text>
  <text x="541" y="100" text-anchor="middle" font-size="9" fill="#999">SQLite JOIN</text>
  <text x="541" y="114" text-anchor="middle" font-size="9" fill="#999">제목·감성·이미지</text>

  <path d="M606,96 L627,96" stroke="#bbb" stroke-width="1.2" fill="none" marker-end="url(#a)"/>

  <!-- Step 5 -->
  <rect x="632" y="60" width="145" height="72" rx="5" fill="#333"/>
  <text x="704" y="87" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">⑤ 점수 계산 + 반환</text>
  <text x="704" y="107" text-anchor="middle" font-size="9" fill="#ccc">Final Score 산출</text>
  <text x="704" y="121" text-anchor="middle" font-size="9" fill="#ccc">Top K 정렬 → JSON</text>

  <!-- Score formula box -->
  <rect x="100" y="160" width="600" height="100" rx="5" fill="#fafafa" stroke="#ddd" stroke-width="1"/>
  <text x="400" y="188" text-anchor="middle" font-size="13" font-weight="700" fill="#333">최종 추천 점수 계산</text>
  <text x="400" y="215" text-anchor="middle" font-size="15" font-weight="600" fill="#333">Final Score = w₁ × Similarity + w₂ × Sentiment</text>
  <line x1="200" y1="228" x2="600" y2="228" stroke="#eee" stroke-width="1"/>
  <text x="400" y="248" text-anchor="middle" font-size="10" fill="#999">Similarity: 코사인 유사도 (사용자 의도 매칭)  ·  Sentiment: 감성 점수 (방문자 만족도)</text>
</svg>