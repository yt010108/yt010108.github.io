<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 580" font-family="'Pretendard','Noto Sans KR','Helvetica Neue',sans-serif">
  <defs>
    <filter id="s" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.06"/>
    </filter>
    <marker id="a" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0 0,7 2.5,0 5" fill="#999"/>
    </marker>
    <marker id="ab" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0 0,7 2.5,0 5" fill="#333"/>
    </marker>
  </defs>

  <rect width="880" height="580" fill="#fff"/>

  <!-- Title -->
  <text x="440" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#111">System Architecture</text>
  <line x1="340" y1="46" x2="540" y2="46" stroke="#ddd" stroke-width="1"/>

  <!-- Batch Server -->
  <rect x="30" y="70" width="390" height="230" rx="6" fill="#fafafa" stroke="#ddd" stroke-width="1"/>
  <text x="225" y="94" text-anchor="middle" font-size="13" font-weight="700" fill="#333">Batch Server</text>
  <text x="225" y="110" text-anchor="middle" font-size="10" fill="#999">데이터 파이프라인</text>

  <rect x="50" y="125" width="105" height="42" rx="4" fill="#fff" stroke="#ccc" stroke-width="1"/>
  <text x="102" y="143" text-anchor="middle" font-size="10" font-weight="600" fill="#333">VisitJeju API</text>
  <text x="102" y="158" text-anchor="middle" font-size="9" fill="#999">장소 수집</text>

  <rect x="175" y="125" width="105" height="42" rx="4" fill="#fff" stroke="#ccc" stroke-width="1"/>
  <text x="227" y="143" text-anchor="middle" font-size="10" font-weight="600" fill="#333">Selenium</text>
  <text x="227" y="158" text-anchor="middle" font-size="9" fill="#999">리뷰 크롤링</text>

  <rect x="300" y="125" width="105" height="42" rx="4" fill="#fff" stroke="#ccc" stroke-width="1"/>
  <text x="352" y="143" text-anchor="middle" font-size="10" font-weight="600" fill="#333">KoNLPy+TF-IDF</text>
  <text x="352" y="158" text-anchor="middle" font-size="9" fill="#999">키워드 추출</text>

  <rect x="50" y="185" width="105" height="42" rx="4" fill="#fff" stroke="#ccc" stroke-width="1"/>
  <text x="102" y="203" text-anchor="middle" font-size="10" font-weight="600" fill="#333">KOTE</text>
  <text x="102" y="218" text-anchor="middle" font-size="9" fill="#999">감성 분석</text>

  <rect x="175" y="185" width="105" height="42" rx="4" fill="#fff" stroke="#ccc" stroke-width="1"/>
  <text x="227" y="203" text-anchor="middle" font-size="10" font-weight="600" fill="#333">Gemma3</text>
  <text x="227" y="218" text-anchor="middle" font-size="9" fill="#999">맥락 생성</text>

  <rect x="300" y="185" width="105" height="42" rx="4" fill="#fff" stroke="#ccc" stroke-width="1"/>
  <text x="352" y="203" text-anchor="middle" font-size="10" font-weight="600" fill="#333">Arctic Embed</text>
  <text x="352" y="218" text-anchor="middle" font-size="9" fill="#999">벡터 임베딩</text>

  <!-- Arrows between batch modules -->
  <path d="M157,146 L172,146" stroke="#bbb" stroke-width="1" fill="none" marker-end="url(#a)"/>
  <path d="M282,146 L297,146" stroke="#bbb" stroke-width="1" fill="none" marker-end="url(#a)"/>
  <path d="M157,206 L172,206" stroke="#bbb" stroke-width="1" fill="none" marker-end="url(#a)"/>
  <path d="M282,206 L297,206" stroke="#bbb" stroke-width="1" fill="none" marker-end="url(#a)"/>

  <text x="225" y="260" text-anchor="middle" font-size="9" fill="#bbb">9단계 파이프라인: 수집 → 분석 → 임베딩 → 저장</text>

  <!-- Database Layer -->
  <rect x="50" y="280" width="160" height="38" rx="4" fill="#f5f5f5" stroke="#ccc" stroke-width="1"/>
  <text x="130" y="304" text-anchor="middle" font-size="11" font-weight="600" fill="#333">SQLite</text>

  <rect x="230" y="280" width="160" height="38" rx="4" fill="#f5f5f5" stroke="#ccc" stroke-width="1"/>
  <text x="310" y="304" text-anchor="middle" font-size="11" font-weight="600" fill="#333">ChromaDB</text>

  <!-- API Server -->
  <rect x="460" y="70" width="390" height="175" rx="6" fill="#fafafa" stroke="#ddd" stroke-width="1"/>
  <text x="655" y="94" text-anchor="middle" font-size="13" font-weight="700" fill="#333">API Server</text>
  <text x="655" y="110" text-anchor="middle" font-size="10" fill="#999">FastAPI + Uvicorn</text>

  <rect x="480" y="125" width="160" height="42" rx="4" fill="#fff" stroke="#ccc" stroke-width="1"/>
  <text x="560" y="143" text-anchor="middle" font-size="10" font-weight="600" fill="#333">POST /search/</text>
  <text x="560" y="158" text-anchor="middle" font-size="9" fill="#999">시맨틱 검색</text>

  <rect x="665" y="125" width="160" height="42" rx="4" fill="#fff" stroke="#ccc" stroke-width="1"/>
  <text x="745" y="143" text-anchor="middle" font-size="10" font-weight="600" fill="#333">GET /health/</text>
  <text x="745" y="158" text-anchor="middle" font-size="9" fill="#999">상태 확인</text>

  <rect x="480" y="185" width="345" height="35" rx="4" fill="#f9f9f9" stroke="#e0e0e0" stroke-width="1"/>
  <text x="652" y="207" text-anchor="middle" font-size="9" fill="#888">CORS · Input Validation · Non-root Docker · Healthcheck</text>

  <!-- Frontend -->
  <rect x="460" y="270" width="390" height="145" rx="6" fill="#fafafa" stroke="#ddd" stroke-width="1"/>
  <text x="655" y="294" text-anchor="middle" font-size="13" font-weight="700" fill="#333">Frontend</text>
  <text x="655" y="310" text-anchor="middle" font-size="10" fill="#999">React 18 + Nginx</text>

  <rect x="480" y="325" width="105" height="38" rx="4" fill="#fff" stroke="#ccc" stroke-width="1"/>
  <text x="532" y="342" text-anchor="middle" font-size="10" font-weight="600" fill="#333">SearchHero</text>
  <text x="532" y="356" text-anchor="middle" font-size="9" fill="#999">검색 UI</text>

  <rect x="600" y="325" width="105" height="38" rx="4" fill="#fff" stroke="#ccc" stroke-width="1"/>
  <text x="652" y="342" text-anchor="middle" font-size="10" font-weight="600" fill="#333">PlaceCard</text>
  <text x="652" y="356" text-anchor="middle" font-size="9" fill="#999">결과 카드</text>

  <rect x="720" y="325" width="105" height="38" rx="4" fill="#fff" stroke="#ccc" stroke-width="1"/>
  <text x="772" y="342" text-anchor="middle" font-size="10" font-weight="600" fill="#333">PlaceDetail</text>
  <text x="772" y="356" text-anchor="middle" font-size="9" fill="#999">상세 모달</text>

  <text x="655" y="400" text-anchor="middle" font-size="9" fill="#bbb">Nginx Reverse Proxy  /api/ → API Server (Docker 내부 네트워크)</text>

  <!-- Infrastructure -->
  <rect x="30" y="440" width="820" height="120" rx="6" fill="#f8f8f8" stroke="#ddd" stroke-width="1"/>
  <text x="440" y="465" text-anchor="middle" font-size="13" font-weight="700" fill="#333">Infrastructure</text>
  <text x="440" y="481" text-anchor="middle" font-size="10" fill="#999">Docker Compose + Oracle Cloud</text>

  <rect x="55" y="495" width="175" height="48" rx="4" fill="#fff" stroke="#ccc" stroke-width="1"/>
  <text x="142" y="516" text-anchor="middle" font-size="10" font-weight="600" fill="#333">Docker Compose</text>
  <text x="142" y="532" text-anchor="middle" font-size="9" fill="#999">멀티 컨테이너 · Named Volumes</text>

  <rect x="250" y="495" width="175" height="48" rx="4" fill="#fff" stroke="#ccc" stroke-width="1"/>
  <text x="337" y="516" text-anchor="middle" font-size="10" font-weight="600" fill="#333">Oracle Cloud VM</text>
  <text x="337" y="532" text-anchor="middle" font-size="9" fill="#999">E2.1.Micro · 1GB + 4GB Swap</text>

  <rect x="445" y="495" width="175" height="48" rx="4" fill="#fff" stroke="#ccc" stroke-width="1"/>
  <text x="532" y="516" text-anchor="middle" font-size="10" font-weight="600" fill="#333">Security</text>
  <text x="532" y="532" text-anchor="middle" font-size="9" fill="#999">Security List + iptables 이중 방화벽</text>

  <rect x="640" y="495" width="175" height="48" rx="4" fill="#fff" stroke="#ccc" stroke-width="1"/>
  <text x="727" y="516" text-anchor="middle" font-size="10" font-weight="600" fill="#333">Networking</text>
  <text x="727" y="532" text-anchor="middle" font-size="9" fill="#999">Port 80 · Bridge Network</text>

  <!-- Connection arrows -->
  <path d="M420,300 L478,180" stroke="#999" stroke-width="1" stroke-dasharray="4,3" fill="none" marker-end="url(#a)"/>
  <text x="445" y="235" font-size="8" fill="#aaa">data</text>
  <path d="M655,245 L655,268" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#ab)"/>
  <text x="665" y="260" font-size="8" fill="#aaa">API</text>
</svg>