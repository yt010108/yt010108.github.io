{% include "header.html" %}
<main id="main" class="section-page" tabindex="-1">
  <header class="page-head"><p class="hero__eyebrow">Browse by topic</p><h1 class="page-head__title">Tags</h1><p class="page-head__lead">관심 있는 주제에서 다음 기록으로.</p></header>
  {% set tax = get_taxonomy(kind="tags") %}
  <ul class="term-list">
    {% for term in tax.items | sort_by("name") %}
    <li><a href="{{ get_taxonomy_url(kind='tags', term=term.name) }}"><span>{{ term.name | e }}</span><span class="term-count">{{ term.pages | length }}</span></a></li>
    {% endfor %}
  </ul>
</main>
{% include "footer.html" %}
